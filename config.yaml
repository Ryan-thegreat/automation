dart:
  report_types: ["감사보고서", "유상증자결정", "주요사항보고서"]
  lookback_days: 1

news:
  sources:
    - url: "https://rss.hankyung.com/"
      name: "한국경제"
    - url: "https://rss.mt.co.kr/"
      name: "머니투데이"
    - url: "https://www.venturesquare.net/feed"
      name: "벤처스퀘어"
    - url: "https://platum.kr/feed"
      name: "플래텀"
