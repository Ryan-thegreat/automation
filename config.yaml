    - "코스피 상장"
    - "대기업"
    - "재벌"
    - "그룹사"
    - "부동산"
    - "건설"
    - "분양"
    - "적자 지속"
    - "회생절차"
    - "파산"
  inclusion_keywords:
    - "시리즈B"
    - "시리즈C"
    - "시리즈D"
    - "투자 유치"
    - "CFO"
    - "IR담당"
    - "매출 성장"
    - "흑자 전환"
    - "글로벌 확장"

claude:
  model: "claude-opus-4-6"
  max_calls_per_day: 50
